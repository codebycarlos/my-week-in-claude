<!doctype html><html><head><meta charset=utf-8><title>Compare v{a} and v{b}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#141413;font-family:Poppins,sans-serif;color:#e8e6dc}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#262624;border-bottom:1px solid #3a3935;font-size:13px}
.bar a{color:#faf9f5;font-weight:600;text-decoration:none;background:#3a3935;border-radius:8px;padding:8px 14px}
.bar a:focus-visible,.bar input:focus-visible{outline:2px solid #d97757;outline-offset:2px}
.side{white-space:nowrap}.side b{color:#faf9f5}
.bar input{flex:1;accent-color:#d97757}
.stage{position:relative;margin-top:56px;overflow:hidden}
iframe{position:absolute;top:0;left:0;width:100%;border:0;display:block;background:#141413}
#b{clip-path:inset(0 0 0 50%)}
.line{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#d97757;z-index:2;pointer-events:none}
.grab{position:absolute;inset:0;z-index:3;cursor:ew-resize}
.knob{position:fixed;top:50%;z-index:4;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:999px;background:#d97757;color:#141413;
  display:flex;align-items:center;justify-content:center;font-weight:700;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
</style></head><body>
<div class=bar>
  <a href="/">Back to editing</a>
  <span class=side>← <b>v{a}</b>, with your feedback</span>
  <input type=range id=r min=0 max=100 value=50 aria-label="Slide between v{a} and v{b}">
  <span class=side><b>v{b}</b>, with the changes →</span>
</div>
<div class=stage id=stage>
  <iframe id=a src="/?v={a}&embed=feedback" title="v{a} with your feedback"></iframe>
  <iframe id=b src="/?v={b}&embed=changes" title="v{b} with the changes"></iframe>
  <div class=line id=line></div>
  <div class=grab id=grab></div>
</div>
<div class=knob id=knob aria-hidden=true>⇔</div>
<script>
const stage = document.getElementById('stage'), r = document.getElementById('r'), knob = document.getElementById('knob');
function set(p){
  p = Math.max(0, Math.min(100, p)); r.value = p;
  document.getElementById('b').style.clipPath = `inset(0 0 0 ${p}%)`;
  document.getElementById('line').style.left = p + '%';
  knob.style.left = (stage.getBoundingClientRect().left + stage.clientWidth * p / 100) + 'px';
}
function fit(){
  let h = 0;
  document.querySelectorAll('iframe').forEach(f => { try { const d = f.contentDocument.documentElement; f.style.height = d.scrollHeight + 'px'; h = Math.max(h, d.scrollHeight); } catch (e) {} });
  if (h) stage.style.height = h + 'px';
  set(+r.value);
}
document.querySelectorAll('iframe').forEach(f => f.addEventListener('load', () => { fit(); setTimeout(fit, 800); }));
window.addEventListener('resize', fit);
r.oninput = () => set(+r.value);
const grab = document.getElementById('grab');
let drag = false;
const at = e => set(100 * (e.clientX - stage.getBoundingClientRect().left) / stage.clientWidth);
grab.addEventListener('pointerdown', e => { drag = true; grab.setPointerCapture(e.pointerId); at(e); });
grab.addEventListener('pointermove', e => { if (drag) at(e); });
grab.addEventListener('pointerup', () => { drag = false; });
set(50);
</script>
</body></html>
